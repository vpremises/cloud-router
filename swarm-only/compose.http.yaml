version: '3'
services:
  traefik:
    image: ${TRAEFIK_IMAGE:?Set TRAEFIK_IMAGE to a verified image reference}
    ports:
    - 80:80
    command:
    - --entrypoints.web.address=:80
    - --providers.swarm=true
    - --providers.swarm.exposedbydefault=false
    - --providers.swarm.network=proxy-net
    - --api
    - --api.insecure=false
    - --log.level=INFO
    networks:
    - proxy-net
    volumes: []
    deploy:
      labels:
      - traefik.enable=true
      - traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)
      - traefik.http.routers.http-catchall.entrypoints=web
    environment:
      TRAEFIK_PROVIDERS_SWARM_ENDPOINT: ${DOCKER_API_ENDPOINT:?Set a restricted Docker
        API endpoint}
volumes:
  portainer_data: null
networks:
  proxy-net:
    external: true
