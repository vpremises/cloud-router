name: Routing source
on:
  pull_request:
  push:
    branches: [main, 'coela/**']
permissions:
  contents: read
jobs:
  compose-admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate routing composition without deployment
        run: python3 -m unittest discover -s tests -v
