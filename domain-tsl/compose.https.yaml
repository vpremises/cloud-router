version: '3'
services:
  proxy:
    image: ${TRAEFIK_IMAGE:?Set TRAEFIK_IMAGE to a verified image reference}
    volumes:
    - ./config/traefik.toml:/etc/traefik/traefik.toml
    ports:
    - 80:80
    - 443:443
    restart: unless-stopped
    networks:
    - traefik-public
    - proxy-net
    labels:
    - traefik.enable=true
    - traefik.http.middlewares.https-redirect.redirectscheme.scheme=https
    - traefik.http.middlewares.https-redirect.redirectscheme.permanent=true
    environment:
      TRAEFIK_PROVIDERS_SWARM_ENDPOINT: ${DOCKER_API_ENDPOINT:?Set a restricted Docker
        API endpoint}
networks:
  traefik-public:
    external: true
  proxy-net:
    external: true
